name: Deploy interactive demo

on:
  push:
    branches: [main]
    paths: ['demo/**', '.github/workflows/demo-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify demonstration behavior
        run: node --test demo/tests/*.test.mjs
      - name: Package only public demo assets
        run: |
          mkdir site
          cp demo/index.html demo/styles.css demo/app.mjs demo/scene.mjs demo/simulation.mjs demo/favicon.svg demo/.nojekyll site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
